name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Check Ruby syntax
        run: ruby -c local_server.rb
      - name: Check repository for secrets
        run: ruby scripts/security_check.rb

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.x"
          cache: true
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Test
        run: go test ./...
      - name: Check repository for secrets with Go
        run: go run ./cmd/security-check
      - name: Test with race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./...
      - name: Check Bash Go scripts
        if: runner.os != 'Windows'
        run: bash -n bin/setup bin/start bin/setup-go bin/start-go
      - name: Check PowerShell scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          [void][scriptblock]::Create((Get-Content -Raw windows/setup-go.ps1))
          [void][scriptblock]::Create((Get-Content -Raw windows/start-go.ps1))
          [void][scriptblock]::Create((Get-Content -Raw release/windows/setup.ps1))
